name: Install Smoke

# QF-17: blocks PRs where the published tarball is unconsumable.
#
# Catches the class of regressions that unit tests miss because they
# run against the source tree:
#   - package.json files[] dropped a required path so the tarball is
#     incomplete (no manifest, no policies/, no LICENSE, etc.)
#   - dist/index.js stops exporting AxonFlowClient at the top level
#   - openclaw.plugin.json gains a structural change (renamed id,
#     missing configSchema property) that breaks ClawHub install
#   - the AxonFlowClient + agent wire shape regresses on Plugin
#     Batch 1 fields (decision_id, risk_level, policy_matches,
#     override_available)
#
# Test runs entirely against a local stub HTTP server — no live
# AxonFlow stack required. The full install-and-use matrix against a
# real docker-compose stack lives alongside the platform in
# axonflow-enterprise/tests/e2e/plugin-batch-1/openclaw-install/ and
# is exercised by the workflow_dispatch-only Smoke E2E job.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'policies/**'
      - 'openclaw.plugin.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tests/install-smoke/**'
      - '.github/workflows/install-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'policies/**'
      - 'openclaw.plugin.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tests/install-smoke/**'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

concurrency:
  # PR-scoped cancel-in-progress only. Pushes to main keep their full
  # run so the per-commit smoke artifact isn't truncated by a fast
  # follow-up commit.
  group: install-smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-smoke:
    name: Pack, Install, Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      # PR runs only the lower bound. Push, dispatch, and merge validate both
      # versions to keep the "tarball-installs-everywhere" invariant. The
      # lower-bound-only PR run still catches breakage where most install
      # regressions surface.
      #
      # The lower bound is 22, not 20, and it is NOT ours to choose. This
      # package declares `openclaw` as a peerDependency, npm 7+ installs peers
      # automatically, and current OpenClaw releases ship a preinstall guard
      # that HARD-FAILS the install:
      #
      #   [openclaw] error: this OpenClaw release requires Node
      #   >=22.22.3 <23 || >=24.15.0 <25 || >=25.9.0.
      #
      # so `npm install <tarball>` exits 1 on Node 20 regardless of anything in
      # this repo. Verified against origin/main's own tarball: fails on node:20,
      # installs clean on node:22 (22.23.2) and node:24 (24.20.0). Pinning 20
      # here asserted a configuration a user cannot actually be in — OpenClaw
      # itself will not run on Node 20, so an OpenClaw plugin cannot be
      # exercised there either.
      matrix:
        node-version: ${{ fromJson(github.event_name == 'pull_request' && '[22]' || '[22, 24]') }}
    env:
      AXONFLOW_TELEMETRY: 'off'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install build deps
        run: npm ci

      - name: Run install-smoke harness
        run: node tests/install-smoke/run.mjs

      - name: Verify plugin doctor has zero diagnostics
        run: |
          set -euo pipefail
          DOCTOR_OUT=$(openclaw plugins doctor 2>&1 || true)
          if echo "$DOCTOR_OUT" | grep -q "axonflow-governance"; then
            echo "::error::openclaw plugins doctor reported diagnostics for axonflow-governance:"
            echo "$DOCTOR_OUT" | grep "axonflow-governance"
            exit 1
          fi
          echo "OK: plugins doctor clean for axonflow-governance"
