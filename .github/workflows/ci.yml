name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      AXONFLOW_TELEMETRY: "off"
    strategy:
      # PR runs only Node 20 (the lower bound this plugin supports). Push to
      # main and workflow_dispatch run the full matrix to catch version-
      # specific drift before tagging. install-smoke.yml mirrors this so a
      # tarball that installs on one but not the other is still gated
      # at merge time.
      matrix:
        node-version: ${{ fromJson(github.event_name == 'pull_request' && '[20]' || '[20, 22]') }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # #3619. The suite above asserts the license_tier behaviour; this asserts
      # that suite can actually go red. A green suite alone would not
      # distinguish "the field works" from "nothing is being read off the wire".
      # The gate mutates src/telemetry.ts in place and restores it, then checks
      # the file hashes identical to how it started.
      - name: "license_tier mutation gate (the suite must be able to fail, #3619)"
        run: bash tests/telemetry-license-tier-mutation-gate.sh
