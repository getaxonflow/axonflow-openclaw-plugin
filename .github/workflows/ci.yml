name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      AXONFLOW_TELEMETRY: "off"
    strategy:
      # PR runs only Node 20 (the lower bound this plugin supports). Push to
      # main and workflow_dispatch run the full matrix to catch version-
      # specific drift before tagging. install-smoke.yml mirrors this so a
      # tarball that installs on one but not the other is still gated
      # at merge time.
      matrix:
        node-version: ${{ fromJson(github.event_name == 'pull_request' && '[20]' || '[20, 22]') }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage
