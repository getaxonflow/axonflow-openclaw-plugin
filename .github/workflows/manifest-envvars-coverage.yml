name: manifest-envvars-coverage

# Catch drift between AXONFLOW_* env vars referenced in shipped code and docs.
# OpenClaw and ClawHub do not support top-level envVars or runtimeBehavior in a
# code-plugin manifest, so the manifest must omit both fields. The README is the
# user-facing declaration for this plugin's environment variables and behavior.
#
# Two sources must stay in sync:
#   1. AXONFLOW_* references in src/, bin/  (shipped runtime code)
#   2. README.md "## Environment variables" table  (user-facing prose)
#
# Internal-only vars (HARNESS_*, LOGS, OPENAPI_SPECS_DIR, CHECKPOINT_URL,
# CLIENT_ID, CLIENT_SECRET) are excluded — these are SDK-side or test-only
# and don't belong in the plugin manifest.
#
# Per `feedback_plugin_manifest_envvars_hygiene.md`.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'openclaw.plugin.json'
      - 'README.md'
      - '.github/workflows/manifest-envvars-coverage.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute environment-variable documentation coverage
        run: |
          set -euo pipefail

          # 1) AXONFLOW_* refs in shipped code (src/ + bin/), excluding internals
          grep -rhoE 'AXONFLOW_[A-Z_]+' src/ bin/ \
            | sort -u \
            | grep -vE '^AXONFLOW_HARNESS|^AXONFLOW_LOGS|^AXONFLOW_OPENAPI|^AXONFLOW_CHECKPOINT_URL|^AXONFLOW_CLIENT_(ID|SECRET)$' \
            > /tmp/code-refs.txt
          echo "Code references (src/ + bin/):"
          cat /tmp/code-refs.txt
          echo ""

          # 2) README.md "## Environment variables" section. Extract every
          # AXONFLOW_* mention from table rows under that heading.
          # State-machine awk (vs range pattern) so the start heading
          # itself doesn't terminate the section on /^## /.
          awk '
            $0 ~ /^## Environment variables/ { in_section = 1; next }
            in_section && /^## / { exit }
            in_section && /^\| `AXONFLOW_/ { print }
          ' README.md \
            | grep -oE 'AXONFLOW_[A-Z_]+' \
            | sort -u \
            > /tmp/readme-decl.txt
          echo "README.md table declarations:"
          cat /tmp/readme-decl.txt
          echo ""

          # Unsupported top-level manifest fields must stay absent. Their
          # presence causes a ClawHub compatibility warning and OpenClaw does
          # not consume them for this code plugin.
          python3 - <<'PY'
          import json
          manifest = json.load(open('openclaw.plugin.json', encoding='utf-8'))
          unsupported = sorted({'envVars', 'runtimeBehavior'} & manifest.keys())
          if unsupported:
              raise SystemExit(
                  'unsupported top-level manifest fields: ' + ', '.join(unsupported)
              )
          print('Manifest compatibility: unsupported top-level fields absent')
          PY

          # Drift check
          FAIL=0
          if ! diff -q /tmp/code-refs.txt /tmp/readme-decl.txt >/dev/null; then
            echo "::error::AXONFLOW_* drift between shipped code and README.md env-vars table:"
            diff /tmp/code-refs.txt /tmp/readme-decl.txt || true
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "::error::Resolution: every user-facing AXONFLOW_* referenced in src/ or bin/ must be declared in the README.md '## Environment variables' table."
            exit 1
          fi
          echo "OK: code refs == README table ($(wc -l < /tmp/code-refs.txt) entries)"
