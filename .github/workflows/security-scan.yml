name: Security Scan

# Two-layer pre-publish guard, both PR-blocking.
#
# Layer 1 (`scripts/check-publish-bait.mjs`): static grep guard that
# walks every path shipping to npm and forbids property shapes known to
# trip static analyzers. Independent of any external scanner version.
#
# Layer 2 (`scripts/scan-tarball.mjs`): runs the OpenClaw plugin
# scanner against the npm-pack tarball — the same artifact ClawHub
# scans at publish time. Invoked via `openclaw plugins install <tarball>`
# with isolated state so the run never pollutes a real install.
#
# Both layers run via `npm run scan`, which chains
# `npm run build && npm run check:publish-bait && node scripts/scan-tarball.mjs --no-build`.
# Either failing fails the PR.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw.plugin.json'
      - 'tsconfig.json'
      - 'scripts/scan-tarball.mjs'
      - 'scripts/check-publish-bait.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'policies/**'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw.plugin.json'
      - 'tsconfig.json'
      - 'scripts/scan-tarball.mjs'
      - 'scripts/check-publish-bait.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'policies/**'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    name: Pack + scan tarball with openclaw
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AXONFLOW_TELEMETRY: 'off'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install build deps
        run: npm ci

      # Install the latest published openclaw on every run. This is
      # deliberate: the scanner ruleset evolves with each openclaw
      # release; pinning here would let new rules ship without us
      # noticing. If a future ruleset rejects our package, that is the
      # signal to refactor — not the signal to pin.
      - name: Install openclaw CLI (latest)
        run: npm install -g openclaw@latest

      - name: Run security scan against packed tarball
        run: npm run scan
