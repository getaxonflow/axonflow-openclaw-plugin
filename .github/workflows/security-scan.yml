name: Security Scan

# Two-layer pre-publish guard, both PR-blocking.
#
# Layer 1 (`scripts/check-publish-bait.mjs`): static grep guard that
# walks every path shipping to npm and forbids property shapes known to
# trip static analyzers. Independent of any external scanner version.
#
# Layer 2 (`scripts/scan-tarball.mjs`): configures the fail-closed
# `security.installPolicy` command in `scripts/openclaw-install-policy.mjs`,
# proves a hostile credential-exfiltration fixture is blocked, and installs
# the exact npm-pack tarball through current OpenClaw with isolated state.
#
# Both layers run via `npm run scan`, which chains
# `npm run build && npm run check:publish-bait && node scripts/scan-tarball.mjs --no-build`.
# Either failing fails the PR.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw.plugin.json'
      - 'tsconfig.json'
      - 'scripts/scan-tarball.mjs'
      - 'scripts/openclaw-install-policy.mjs'
      - 'scripts/check-publish-bait.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'policies/**'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw.plugin.json'
      - 'tsconfig.json'
      - 'scripts/scan-tarball.mjs'
      - 'scripts/openclaw-install-policy.mjs'
      - 'scripts/check-publish-bait.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'policies/**'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    name: Pack + scan tarball with openclaw
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AXONFLOW_TELEMETRY: 'off'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install build deps
        run: npm ci

      # Install the latest published OpenClaw on every run. The operator-owned
      # policy remains stable, while this catches install protocol and config
      # compatibility changes before publication.
      - name: Install openclaw CLI (latest)
        run: npm install -g openclaw@latest

      - name: Run security scan against packed tarball
        run: OPENCLAW_BIN="$(npm prefix -g)/bin/openclaw" npm run scan
