name: Security Scan

# Pre-publish gate: two layers, both PR-blocking.
#
# Layer 1 (`scripts/check-publish-bait.mjs`): static grep guard,
# independent of any external scanner version. Walks every path that
# ships to npm — `dist/`, `policies/`, `README.md`, `CHANGELOG.md`,
# `LICENSE`, `openclaw.plugin.json` — and forbids known regex-bait
# property shapes for credential-shaped keys. Catches the class of
# scanner regression that blocked v2.0.1 install AND the documentation
# regression that blocked v2.0.2: per-line rules that don't distinguish
# runtime variable forwarding from hardcoded literals, and that scan
# every file in the tarball, not just compiled JavaScript. This layer
# fires regardless of which OpenClaw scanner ruleset is on `latest` —
# defense in depth against ruleset drift.
#
# Layer 2 (`scripts/scan-tarball.mjs`): runs the official OpenClaw
# plugin scanner against the npm-pack tarball — exactly the artifact
# ClawHub re-scans server-side at publish time. Catches today's flagged
# patterns (env-then-fetch co-location, fs-then-fetch co-location,
# shell-exec patterns in scripts that end up in the tarball). Invoked
# via `openclaw plugins install <tarball>` with isolated state
# (OPENCLAW_STATE_DIR=mktemp -d) so the run never pollutes a real
# install.
#
# Both layers run via `npm run scan`, which chains
# `npm run build && npm run check:publish-bait && node scripts/scan-tarball.mjs --no-build`.
# Either failing fails the PR.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw.plugin.json'
      - 'tsconfig.json'
      - 'scripts/scan-tarball.mjs'
      - 'scripts/check-publish-bait.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'policies/**'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw.plugin.json'
      - 'tsconfig.json'
      - 'scripts/scan-tarball.mjs'
      - 'scripts/check-publish-bait.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'policies/**'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scan:
    name: Pack + scan tarball with openclaw
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AXONFLOW_TELEMETRY: 'off'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install build deps
        run: npm ci

      # Install the latest published openclaw on every run. This is
      # deliberate: the scanner ruleset evolves with each openclaw
      # release; pinning here would let new rules ship without us
      # noticing. If a future ruleset rejects our package, that is the
      # signal to refactor — not the signal to pin.
      - name: Install openclaw CLI (latest)
        run: npm install -g openclaw@latest

      - name: Run security scan against packed tarball
        run: npm run scan
