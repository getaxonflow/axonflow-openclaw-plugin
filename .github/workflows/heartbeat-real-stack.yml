name: Heartbeat Real-Stack E2E

# Runs the localhost-fake-stack harness across Linux + macOS + Windows to
# verify the plugin's Community-SaaS bootstrap and 7-day telemetry
# heartbeat work end-to-end against a real socket without ever touching
# production. Cold-start asserts: registration POST → 0600 file written →
# heartbeat delivered → 0600 stamp written. Warm-cache asserts: no fresh
# registration, telemetry suppressed by the stamp gate.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/heartbeat-real-stack/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/heartbeat-real-stack.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/heartbeat-real-stack/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/heartbeat-real-stack.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-stack:
    name: Real-stack E2E (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OS matrix by event (2026-09-03, CI-cost round 3): a macOS minute
        # counts TEN times and a Windows minute twice against the organisation's
        # Actions allowance, and this matrix ran all three on every PR push.
        # PRs now run the Linux leg; the full three-OS matrix runs on every
        # merge to main (push) and on workflow_dispatch, so cross-OS coverage
        # still lands on every merged commit rather than on every iteration.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node: ["20"]
    env:
      AXONFLOW_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run real-stack harness
        run: node tests/heartbeat-real-stack/run_real_stack.mjs
