name: Heartbeat Real-Stack E2E

# Runs the localhost-fake-stack harness across Linux + macOS + Windows to
# verify the plugin's Community-SaaS bootstrap and 7-day telemetry
# heartbeat work end-to-end against a real socket without ever touching
# production. Cold-start asserts: registration POST → 0600 file written →
# heartbeat delivered → 0600 stamp written. Warm-cache asserts: no fresh
# registration, telemetry suppressed by the stamp gate.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/heartbeat-real-stack/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/heartbeat-real-stack.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/heartbeat-real-stack/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/heartbeat-real-stack.yml"

jobs:
  real-stack:
    name: Real-stack E2E (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20"]
    env:
      AXONFLOW_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run real-stack harness
        run: node tests/heartbeat-real-stack/run_real_stack.mjs
