name: Publish to npm + ClawHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0)'
        required: true

permissions:
  id-token: write
  contents: write

env:
  DO_NOT_TRACK: '1'

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          echo "Updated version to ${VERSION}"
          grep '"version"' package.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## @axonflow/openclaw ${{ github.ref_name }}

            ### Installation

            ```bash
            npm install @axonflow/openclaw
            ```

            Or via OpenClaw plugin manager:

            ```bash
            openclaw plugins install @axonflow/openclaw
            ```

            ### Changes

            See [CHANGELOG.md](https://github.com/getaxonflow/axonflow-openclaw-plugin/blob/main/CHANGELOG.md) for full release details.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-clawhub:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub package publish . \
            --name "@axonflow/openclaw" \
            --display-name "AxonFlow Governance" \
            --version "$VERSION" \
            --changelog "See https://github.com/getaxonflow/axonflow-openclaw-plugin/blob/v${VERSION}/CHANGELOG.md" \
            --source-repo "getaxonflow/axonflow-openclaw-plugin" \
            --source-commit "${{ github.sha }}" \
            --source-ref "v${VERSION}"

  verify-publish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Wait for npm propagation
        run: sleep 30

      - name: Verify package on npm
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Checking npm for @axonflow/openclaw@${VERSION}..."
            if npm view @axonflow/openclaw@${VERSION} version 2>/dev/null | grep -q "${VERSION}"; then
              echo "SUCCESS: @axonflow/openclaw@${VERSION} is available on npm"
              exit 0
            fi
            echo "Not yet available, waiting 30 seconds..."
            sleep 30
          done
          echo "FAILURE: @axonflow/openclaw@${VERSION} not found on npm after 5 attempts"
          exit 1
