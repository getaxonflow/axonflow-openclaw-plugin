name: Publish to npm + ClawHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0)'
        required: true

permissions:
  id-token: write
  contents: write

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  # Preflight runs first and is depended on by every publish/release job.
  # A missing CHANGELOG section for the tag being released MUST fail the
  # whole workflow before npm/ClawHub publish has happened — otherwise we
  # end up with a partial release across registries with no recoverable
  # path on the same tag. The preflight also builds the final release
  # body once and uploads it as an artifact so create-release can consume
  # it without re-running awk.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version from event"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # Extract the CHANGELOG section for the version being released
      # (e.g. 1.3.1 → content between "## [1.3.1]" and the next "## [").
      # awk enters print mode at the matching header, skips the header
      # itself (`next`), and exits at the next version header. If no
      # matching section exists (someone tagged without a CHANGELOG entry),
      # the step fails loudly BEFORE any publish job runs.
      - name: Extract CHANGELOG section
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          awk -v ver="$VERSION" '$0 ~ "^## \\["ver"\\]" {p=1; next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION — refusing to publish."
            echo "::error::Add a '## [$VERSION] - YYYY-MM-DD' section to CHANGELOG.md and re-tag."
            exit 1
          fi
          # Prepend an install block so the registry-facing surface still
          # leads with a copy-paste install recipe. Upstream CHANGELOG
          # focuses on what changed; the install block gives users landing
          # on the release page a starting point.
          {
            echo "## @axonflow/openclaw v${VERSION}"
            echo ""
            echo "### Installation"
            echo ""
            echo '```bash'
            echo "npm install @axonflow/openclaw"
            echo '```'
            echo ""
            echo "Or via OpenClaw plugin manager:"
            echo ""
            echo '```bash'
            echo "openclaw plugins install @axonflow/openclaw"
            echo '```'
            echo ""
            cat /tmp/release-body.md
          } > /tmp/release-body-final.md
          echo "Release body: $(wc -l < /tmp/release-body-final.md) lines"

      - name: Upload release body artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-body
          path: /tmp/release-body-final.md
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          echo "Updated version to ${VERSION}"
          grep '"version"' package.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance

  create-release:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release body artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-body
          path: /tmp/release-body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body/release-body-final.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-clawhub:
    needs: [preflight, publish]
    if: always() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # On workflow_dispatch, check out the version tag so the ClawHub
      # artifact matches the npm artifact byte-for-byte. Without this,
      # a dispatch run from `main` (e.g. to retry after a workflow fix)
      # would publish whatever's on main HEAD, not the code on npm at
      # the requested version. On tag-push, ref defaults to the tag.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies and build
        run: npm ci && npm run build

      # Pin clawhub@0.12.0 — v0.12.1 (2026-05-02) regressed the publish
      # path so that uploads (folder OR tarball) register as
      # `npm-pack (tgz)` artifact format whose served bytes don't match
      # ClawHub's recorded SHA-256, breaking `openclaw plugins install`
      # with integrity errors. v2.0.5 + v2.0.6 hit this. v2.0.4 was
      # published with v0.12.0 and installs cleanly. Hold the pin until
      # ClawHub fixes the regression upstream.
      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.12.0

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Folder upload (Legacy ZIP) is the only working combination right
      # now. v2.0.7 attempted CLI pin v0.12.0 + tarball arg and got
      # `Error: Path must be a folder` — tarball arg was a v0.12.1 feature.
      # v2.0.5 + v2.0.6 (CLI v0.12.1, both upload modes) hit broken-install
      # bytes-mismatch. v2.0.4 (CLI v0.12.0 + folder) is the last known-good
      # combination and still installs cleanly. Holding here until ClawHub
      # fixes the v0.12.1+ regression upstream.
      #
      # --owner saurabhjain1592 works around openclaw/clawhub#2001 (server
      # commit 2d2d791, 2026-05-03). The new scope-inference fallback maps
      # `@axonflow/openclaw` → publisher `axonflow`, which mismatches the
      # stored owner `saurabhjain1592` and rejects the publish. Passing
      # --owner explicitly suppresses the inference branch and the
      # existing-owner equality check passes. Remove once #2001 is fixed.
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub package publish . \
            --family code-plugin \
            --name "@axonflow/openclaw" \
            --owner saurabhjain1592 \
            --display-name "AxonFlow Governance" \
            --version "$VERSION" \
            --changelog "See https://github.com/getaxonflow/axonflow-openclaw-plugin/blob/v${VERSION}/CHANGELOG.md" \
            --source-repo "getaxonflow/axonflow-openclaw-plugin" \
            --source-commit "${{ github.sha }}" \
            --source-ref "v${VERSION}"

  verify-publish:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Wait for npm propagation
        run: sleep 30

      - name: Verify package on npm
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Checking npm for @axonflow/openclaw@${VERSION}..."
            if npm view @axonflow/openclaw@${VERSION} version 2>/dev/null | grep -q "${VERSION}"; then
              echo "SUCCESS: @axonflow/openclaw@${VERSION} is available on npm"
              exit 0
            fi
            echo "Not yet available, waiting 30 seconds..."
            sleep 30
          done
          echo "FAILURE: @axonflow/openclaw@${VERSION} not found on npm after 5 attempts"
          exit 1

  # Verifies the actual end-user install path works against ClawHub. v2.0.5 +
  # v2.0.6 published cleanly and verify-publish (npm-only) passed, but
  # `openclaw plugins install clawhub:@axonflow/openclaw@<v>` failed with
  # ClawHub-side integrity mismatches that no other CI job exercised.
  # If this step fails, the just-published version is uninstallable —
  # ship a follow-up patch.
  verify-clawhub-install:
    needs: [preflight, publish, publish-clawhub]
    runs-on: ubuntu-latest
    env:
      AXONFLOW_TELEMETRY: 'off'
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install openclaw CLI
        run: npm install -g openclaw

      - name: Wait for ClawHub propagation
        run: sleep 30

      - name: Install via openclaw plugins install clawhub
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i: openclaw plugins install clawhub:@axonflow/openclaw@${VERSION}"
            openclaw plugins install "clawhub:@axonflow/openclaw@${VERSION}" 2>&1 | tee /tmp/install-out.log || true
            if grep -q "Installed plugin: axonflow-governance" /tmp/install-out.log; then
              echo "SUCCESS: ClawHub install path returns the plugin cleanly"
              exit 0
            fi
            echo "Install attempt $i did not succeed, retrying in 30s..."
            sleep 30
          done
          echo "FAILURE: ClawHub install path is broken for @axonflow/openclaw@${VERSION}"
          echo "Last output:"
          cat /tmp/install-out.log
          exit 1
