name: Publish to npm + ClawHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0)'
        required: true

permissions:
  id-token: write
  contents: write

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  # Preflight runs first and is depended on by every publish/release job.
  # A missing CHANGELOG section for the tag being released MUST fail the
  # whole workflow before npm/ClawHub publish has happened — otherwise we
  # end up with a partial release across registries with no recoverable
  # path on the same tag. The preflight also builds the final release
  # body once and uploads it as an artifact so create-release can consume
  # it without re-running awk.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version from event"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # Extract the CHANGELOG section for the version being released
      # (e.g. 1.3.1 → content between "## [1.3.1]" and the next "## [").
      # awk enters print mode at the matching header, skips the header
      # itself (`next`), and exits at the next version header. If no
      # matching section exists (someone tagged without a CHANGELOG entry),
      # the step fails loudly BEFORE any publish job runs.
      #
      # Cumulative-notes rule: when the release is a patch (Z>0) AND the
      # parent minor (X.Y.0) was tagged within the last 24h, append the
      # parent minor's CHANGELOG section to the release body. Reason: the
      # latest-tag GH release page is the most-clicked discovery surface;
      # if a same-day patch ships on top of a feature minor and the patch
      # body only lists hygiene fixes, the actual feature story is hidden
      # in the previous tag's release page. Per
      # `feedback_patch_release_notes_cumulative.md` after the v2.3.0/v2.3.1
      # incident on 2026-05-07.
      - name: Extract CHANGELOG section
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          awk -v ver="$VERSION" '$0 ~ "^## \\["ver"\\]" {p=1; next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION — refusing to publish."
            echo "::error::Add a '## [$VERSION] - YYYY-MM-DD' section to CHANGELOG.md and re-tag."
            exit 1
          fi
          # Prepend an install block so the registry-facing surface still
          # leads with a copy-paste install recipe. Upstream CHANGELOG
          # focuses on what changed; the install block gives users landing
          # on the release page a starting point.
          {
            echo "## @axonflow/openclaw v${VERSION}"
            echo ""
            echo "### Installation"
            echo ""
            echo '```bash'
            echo "npm install @axonflow/openclaw"
            echo '```'
            echo ""
            echo "Or via OpenClaw plugin manager:"
            echo ""
            echo '```bash'
            echo "openclaw plugins install @axonflow/openclaw"
            echo '```'
            echo ""
            cat /tmp/release-body.md
          } > /tmp/release-body-final.md

          # Cumulative parent-minor section if patch <24h after parent.
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "$PATCH" != "0" ]; then
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PARENT="${MAJOR}.${MINOR}.0"
            # Fetch parent tag explicitly (workflow checkout is shallow).
            git fetch --depth=1 origin "refs/tags/v${PARENT}:refs/tags/v${PARENT}" 2>/dev/null || true
            PARENT_TIME=$(git log -1 --format=%ct "v${PARENT}" 2>/dev/null || echo 0)
            if [ "$PARENT_TIME" -gt 0 ]; then
              NOW=$(date +%s)
              HOURS=$(( (NOW - PARENT_TIME) / 3600 ))
              if [ "$HOURS" -lt 24 ]; then
                echo "Cumulative-notes: appending v${PARENT} CHANGELOG section (${HOURS}h ago)"
                {
                  echo ""
                  echo "---"
                  echo ""
                  echo "## v${PARENT} — feature release (carried forward, ${HOURS}h ago)"
                  echo ""
                  awk -v ver="$PARENT" '$0 ~ "^## \\["ver"\\]" {p=1; next} p && /^## \[/ {exit} p {print}' CHANGELOG.md
                } >> /tmp/release-body-final.md
              else
                echo "Cumulative-notes: parent v${PARENT} is ${HOURS}h old (>=24h), not appending"
              fi
            fi
          fi
          echo "Release body: $(wc -l < /tmp/release-body-final.md) lines"

      - name: Upload release body artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-body
          path: /tmp/release-body-final.md
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          echo "Updated version to ${VERSION}"
          grep '"version"' package.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance

  create-release:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release body artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-body
          path: /tmp/release-body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body/release-body-final.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-clawhub:
    needs: [preflight, publish]
    if: always() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # On workflow_dispatch, check out the version tag so the ClawHub
      # artifact matches the npm artifact byte-for-byte. Without this,
      # a dispatch run from `main` (e.g. to retry after a workflow fix)
      # would publish whatever's on main HEAD, not the code on npm at
      # the requested version. On tag-push, ref defaults to the tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies and build
        run: npm ci && npm run build

      # Pin clawhub@0.12.3 — v0.12.2 (2026-05-02 21:45 UTC) shipped the
      # CLI fix for v0.12.1's tarball-bytes-mismatch regression
      # ("publish code plugins as clawpacks and allow legacy package
      # downloads"); v0.12.3 (2026-05-06) added monorepo support +
      # dry-run-metadata-only + scope-owner inference. Confirmed working
      # via local `clawhub package pack` + `clawhub package publish .
      # --dry-run` against this repo at v2.3.2 — produced clean ClawPack
      # tarball with correct sha256/integrity.
      #
      # Migration from v0.12.0 (Legacy ZIP folder upload) → v0.12.3
      # (ClawPack folder upload, CLI auto-packs + uploads as ClawPack):
      # closes the "Legacy ZIP — may have compatibility issues" badge
      # on the ClawHub listing AND moves the verification tier from
      # `source-linked` (lowest) to a higher tier per the modern
      # plugin architecture. Note: ClawPack format does NOT close the
      # ClawScan "Credentials" review concern — that's upstream-blocked
      # because code plugins have no envVars schema slot in their
      # capabilities indexing today (the clawhub@0.7.0 envVars schema
      # is skill-side only). See feedback_plugin_manifest_envvars_hygiene.md.
      #
      # Safety net: existing `verify-clawhub-install` job runs
      # `openclaw plugins install clawhub:@axonflow/openclaw@<version>`
      # and would catch any bytes-mismatch immediately — same gate
      # that broke v2.0.5/v2.0.6 visibly during the v0.12.1 regression.
      # If broken, revert to clawhub@0.12.0 + folder upload (Legacy ZIP)
      # — well-understood path per
      # `feedback_clawhub_cli_v0_12_1_tarball_regression.md`.
      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.12.3

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Folder argument with clawhub@0.12.3 — CLI auto-packs the source
      # folder into a ClawPack npm-style tarball + uploads. No `npm pack`
      # step needed; the CLI handles tarball generation internally. The
      # `.clawhubignore` file controls what files end up in the ClawPack.
      #
      # --owner axonflow matches the @axonflow package scope. ClawHub
      # enforces strict scope-owner match as of 2026-05-09; PR #127
      # changed this from --owner saurabhjain1592 (the prior workaround
      # for openclaw/clawhub#2001) after package ownership was
      # transferred to the @axonflow org via `clawhub package transfer`.
      # See engineering/runbooks/RUNBOOK_OPENCLAW_PUBLISHING.md Part 4 for the
      # full --owner flag history. If publish-clawhub fails on owner
      # grounds, read the error verbatim and consult the runbook before
      # changing this flag — direction has flipped twice in 6 days.
      - name: Publish to ClawHub (ClawPack format)
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub package publish . \
            --family code-plugin \
            --name "@axonflow/openclaw" \
            --owner axonflow \
            --display-name "AxonFlow Governance" \
            --version "$VERSION" \
            --changelog "See https://github.com/getaxonflow/axonflow-openclaw-plugin/blob/v${VERSION}/CHANGELOG.md" \
            --source-repo "getaxonflow/axonflow-openclaw-plugin" \
            --source-commit "${{ github.sha }}" \
            --source-ref "v${VERSION}"

  verify-publish:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Wait for npm propagation
        run: sleep 30

      - name: Verify package on npm
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Checking npm for @axonflow/openclaw@${VERSION}..."
            if npm view @axonflow/openclaw@${VERSION} version 2>/dev/null | grep -q "${VERSION}"; then
              echo "SUCCESS: @axonflow/openclaw@${VERSION} is available on npm"
              exit 0
            fi
            echo "Not yet available, waiting 30 seconds..."
            sleep 30
          done
          echo "FAILURE: @axonflow/openclaw@${VERSION} not found on npm after 5 attempts"
          exit 1

  # Verifies the actual end-user install path works against ClawHub. v2.0.5 +
  # v2.0.6 published cleanly and verify-publish (npm-only) passed, but
  # `openclaw plugins install clawhub:@axonflow/openclaw@<v>` failed with
  # ClawHub-side integrity mismatches that no other CI job exercised.
  # If this step fails, the just-published version is uninstallable —
  # ship a follow-up patch.
  verify-clawhub-install:
    needs: [preflight, publish, publish-clawhub]
    runs-on: ubuntu-latest
    env:
      AXONFLOW_TELEMETRY: 'off'
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install openclaw CLI
        run: npm install -g openclaw

      - name: Wait for ClawHub propagation
        run: sleep 30

      - name: Install via openclaw plugins install clawhub
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for i in 1 2 3 4 5; do
            echo "Attempt $i: openclaw plugins install clawhub:@axonflow/openclaw@${VERSION}"
            openclaw plugins install "clawhub:@axonflow/openclaw@${VERSION}" 2>&1 | tee /tmp/install-out.log || true
            if grep -q "Installed plugin: axonflow-governance" /tmp/install-out.log; then
              echo "SUCCESS: ClawHub install path returns the plugin cleanly"
              exit 0
            fi
            echo "Install attempt $i did not succeed, retrying in 30s..."
            sleep 30
          done
          echo "FAILURE: ClawHub install path is broken for @axonflow/openclaw@${VERSION}"
          echo "Last output:"
          cat /tmp/install-out.log
          exit 1
